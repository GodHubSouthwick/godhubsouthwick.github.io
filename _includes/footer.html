<!-- FOOTER CONTACT DETAILS -->
<div>
    <h1>Contact Us</h1>
    <p>Email: <a href="mailto:{{ site.data.contact.contact_email }}">{{ site.data.contact.contact_email }}</a></p>
    <p>Phone number: {{ site.data.contact.phone }}</p>
    <p>(We aim to reply within 7 days)</p>
    <div class="mid-width-reshuffle">
        <h1>Quick Links</h1>
            <a href="/mission" class="footer-link">Our mission</a>
            <a href="/values" class="footer-link">Our values</a>
    </div>
</div>


<!-- FOOTER QUICK LINKS -->
<div class="laptop-only anti-mid-width-reshuffle">
    <h1>Quick Links</h1>
        {% for item in site.data.quicklinks %}
            <a {% if item.link %} href="{{ item.link }}" {% endif %} {% if item.newtab %} target="_blank" {% endif %} class="footer-link">{{ item.name | capitalize }}</a>
        {% endfor %}
</div>
